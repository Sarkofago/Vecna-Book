name: Compilar mod
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.1.1'
      - name: Descomprimir proyecto
        shell: bash
        run: unzip -q "$(ls *.zip | head -1)" -d proj
      - name: Compilar
        shell: bash
        working-directory: proj
        run: gradle build --no-daemon 2>&1 | tee ../build.log
      - name: Guardar el jar
        uses: actions/upload-artifact@v4
        with:
          name: vecna-mod-jar
          path: proj/build/libs/*.jar
      - name: Guardar el registro de errores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registro-compilacion
          path: build.log
